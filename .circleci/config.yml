version: 2.1

parameters:
  skip_steps:
    type: string
    default: ""
    description: "Comma-separated list of step numbers to skip (e.g., '3,5,8')"

# Define reusable commands
commands:
  notify_slack:
    description: "Notify Slack about deployment status"
    steps:
      - run:
          name: Send Slack Notification
          command: |
            echo "Implement Slack notification"

  check_if_skipped:
    description: "Returns true if step should be skipped"
    parameters:
      step_number:
        type: string
    steps:
      - run:
          name: Check if step << parameters.step_number >> should be skipped
          command: |
            # Convert skip_steps to an array
            IFS=',' read -ra SKIP_ARRAY <<< "<< pipeline.parameters.skip_steps >>"

            # Check if the current step number is in the array
            SKIP=0
            for num in "${SKIP_ARRAY[@]}"; do
              if [[ "$num" == "<< parameters.step_number >>" ]]; then
                SKIP=1
                break
              fi
            done

            if [[ $SKIP -eq 1 ]]; then
              echo "export SKIP_STEP_<< parameters.step_number >>=true" >> "$BASH_ENV"
              echo "Step << parameters.step_number >> will be skipped"
            else
              echo "export SKIP_STEP_<< parameters.step_number >>=false" >> "$BASH_ENV"
              echo "Step << parameters.step_number >> will be executed"
            fi

# Define jobs
jobs:
  deploy_pipeline:
    docker:
      - image: cimg/python:3.9
    steps:
      - checkout
      - setup_remote_docker

      # Install CircleCI CLI if not present
      - run:
          name: Install CircleCI CLI
          command: |
            if ! command -v circleci &> /dev/null; then
              curl -fLSs https://raw.githubusercontent.com/CircleCI-Public/circleci-cli/master/install.sh | sudo bash
            fi

      # Set up skipping environment variables
      - check_if_skipped:
          step_number: "1"
      - check_if_skipped:
          step_number: "2"
      - check_if_skipped:
          step_number: "3"
      - check_if_skipped:
          step_number: "4"
      - check_if_skipped:
          step_number: "5"
      - check_if_skipped:
          step_number: "6"
      - check_if_skipped:
          step_number: "7"
      - check_if_skipped:
          step_number: "8"
      - check_if_skipped:
          step_number: "9"
      - check_if_skipped:
          step_number: "10"
      - check_if_skipped:
          step_number: "11"

      # Step 1: Deploy to Edge Environment
      - when:
          condition:
            equal: [false, << pipeline.env.SKIP_STEP_1 >>]
          steps:
            - run:
                name: "🔧 Step 1: Deploy to Edge Environment"
                command: echo "Pretend we're setting up the environment"

      # Step 2: Run Smoke Tests
      - when:
          condition:
            equal: [false, << pipeline.env.SKIP_STEP_2 >>]
          steps:
            - run:
                name: "🧪 Step 2: Run smoke tests"
                command: echo "Pretend we're running tests"
                no_output_timeout: 30m

      # Step 3: Cleanup Test Environment
      - when:
          condition:
            equal: [false, << pipeline.env.SKIP_STEP_3 >>]
          steps:
            - run:
                name: "🧪 Step 3: Cleanup Test Environment"
                command: echo "Pretend we're cleaning up the environment"

      # Step 4: Run Python Unit Tests
      - when:
          condition:
            equal: [false, << pipeline.env.SKIP_STEP_4 >>]
          steps:
            - run:
                name: "🧪 Step 4: Run Python Unit Tests"
                command: echo "Pretend we're running Python tests"
                no_output_timeout: 30m

      # Step 5: Run Playwright Tests
      - when:
          condition:
            equal: [false, << pipeline.env.SKIP_STEP_5 >>]
          steps:
            - run:
                name: "🧪 Step 5: Run Playwright Tests"
                command: echo "Pretend we're running Playwright tests"
                no_output_timeout: 30m

      # Debugging step after Playwright
      - run:
          name: "Debug after Playwright"
          command: |
            echo "After Playwright tests - continuing with pipeline"
            echo "Current time: $(date)"

      # Step 6: Validate Edge Upgrade Requirements
      - when:
          condition:
            equal: [false, << pipeline.env.SKIP_STEP_6 >>]
          steps:
            - run:
                name: "✅ Step 6: Validate Edge Upgrade Requirements"
                command: echo "Checking prerequisites for edge deployment"

      # Step 7: Deploy to Edge
      - when:
          condition:
            equal: [false, << pipeline.env.SKIP_STEP_7 >>]
          steps:
            - run:
                name: "🚀 Step 7: Deploy to Edge"
                command: echo "Deploying to edge"

      # Step 8: Deploy to Production
      - when:
          condition:
            equal: [false, << pipeline.env.SKIP_STEP_8 >>]
          steps:
            - run:
                name: "🚀 Step 8: Deploy to Production"
                command: echo "Deploying to production"

      # Step 9: Run Performance Tests
      - when:
          condition:
            equal: [false, << pipeline.env.SKIP_STEP_9 >>]
          steps:
            - run:
                name: "🔍 Step 9: Run Performance Tests"
                command: echo "Running performance tests"
                no_output_timeout: 60m

      # Step 10: Update Customer Environments
      - when:
          condition:
            equal: [false, << pipeline.env.SKIP_STEP_10 >>]
          steps:
            - run:
                name: "🚀 Step 10: Update Customer Environments"
                command: |
                  echo "Updating customer environments"
                  echo "Adding verification steps"

      # Step 11: Prepare On-Prem Artifacts
      - when:
          condition:
            equal: [false, << pipeline.env.SKIP_STEP_11 >>]
          steps:
            - run:
                name: "📦 Step 11: Prepare On-Prem Artifacts"
                command: |
                  echo "Building artifacts"
                  echo "Running verification"
                  echo "Uploading to artifact storage"

      # Notify Slack
      - notify_slack

workflows:
  version: 2
  deploy_pipeline:
    jobs:
      - deploy_pipeline:
          context: global
