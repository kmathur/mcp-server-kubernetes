version: 2.1

parameters:
  skip_steps:
    type: string
    default: ""
    description: "Comma-separated list of step names to skip (e.g., 'Run Playwright Tests,Run Smoke Tests')"

# Define reusable commands
commands:
  notify_slack:
    description: "Notify Slack about deployment status"
    steps:
      - run:
          name: Send Slack Notification
          command: |
            echo "Implement Slack notification"

  log_step_check:
    description: "Log if a step will be executed"
    parameters:
      step_name:
        type: string
    steps:
      - run:
          name: "Checking if '<< parameters.step_name >>' should be skipped"
          command: |
            SKIP_LIST=",<< pipeline.parameters.skip_steps >>,"
            if [[ "$SKIP_LIST" == *",<< parameters.step_name >>,"* ]]; then
              echo "SKIPPING: '<< parameters.step_name >>' is in the skip list"
            else
              echo "EXECUTING: '<< parameters.step_name >>' will be executed"
            fi

# Define jobs
jobs:
  deploy_pipeline:
    docker:
      - image: cimg/python:3.9
    steps:
      - checkout
      - setup_remote_docker

      # Install CircleCI CLI if not present
      - run:
          name: Install CircleCI CLI
          command: |
            if ! command -v circleci &> /dev/null; then
              curl -fLSs https://raw.githubusercontent.com/CircleCI-Public/circleci-cli/master/install.sh | sudo bash
            fi

      # Deploy to Edge Environment
      - log_step_check:
          step_name: "Deploy to Edge Environment"
      - when:
          condition:
            not:
              matches:
                pattern: ".*Deploy to Edge Environment.*"
                value: ",<< pipeline.parameters.skip_steps >>,"
          steps:
            - run:
                name: "🔧 Deploy to Edge Environment"
                command: echo "Pretend we're setting up the environment"

      # Run Smoke Tests
      - log_step_check:
          step_name: "Run smoke tests"
      - when:
          condition:
            not:
              matches:
                pattern: ".*Run smoke tests.*"
                value: ",<< pipeline.parameters.skip_steps >>,"
          steps:
            - run:
                name: "🧪 Run smoke tests"
                command: echo "Pretend we're running tests"
                no_output_timeout: 30m

      # Cleanup Test Environment
      - log_step_check:
          step_name: "Cleanup Test Environment"
      - when:
          condition:
            not:
              matches:
                pattern: ".*Cleanup Test Environment.*"
                value: ",<< pipeline.parameters.skip_steps >>,"
          steps:
            - run:
                name: "🧪 Cleanup Test Environment"
                command: echo "Pretend we're cleaning up the environment"

      # Run Python Unit Tests
      - log_step_check:
          step_name: "Run Python Unit Tests"
      - when:
          condition:
            not:
              matches:
                pattern: ".*Run Python Unit Tests.*"
                value: ",<< pipeline.parameters.skip_steps >>,"
          steps:
            - run:
                name: "🧪 Run Python Unit Tests"
                command: echo "Pretend we're running Python tests"
                no_output_timeout: 30m

      # Run Playwright Tests
      - log_step_check:
          step_name: "Run Playwright Tests"
      - when:
          condition:
            not:
              matches:
                pattern: ".*Run Playwright Tests.*"
                value: ",<< pipeline.parameters.skip_steps >>,"
          steps:
            - run:
                name: "🧪 Run Playwright Tests"
                command: echo "Pretend we're running Playwright tests"
                no_output_timeout: 30m

      # Verify we can continue after Playwright
      - run:
          name: "Debug after Playwright"
          command: |
            echo "After Playwright tests - continuing with pipeline"
            echo "Current time: $(date)"

      # Validate Edge Upgrade Requirements
      - log_step_check:
          step_name: "Validate Edge Upgrade Requirements"
      - when:
          condition:
            not:
              matches:
                pattern: ".*Validate Edge Upgrade Requirements.*"
                value: ",<< pipeline.parameters.skip_steps >>,"
          steps:
            - run:
                name: "✅ Validate Edge Upgrade Requirements"
                command: echo "Checking prerequisites for edge deployment"

      # Deploy to Edge
      - log_step_check:
          step_name: "Deploy to Edge"
      - when:
          condition:
            not:
              matches:
                pattern: ".*Deploy to Edge.*"
                value: ",<< pipeline.parameters.skip_steps >>,"
          steps:
            - run:
                name: "🚀 Deploy to Edge"
                command: echo "Deploying to edge"

      # Deploy to Production
      - log_step_check:
          step_name: "Deploy to Production"
      - when:
          condition:
            not:
              matches:
                pattern: ".*Deploy to Production.*"
                value: ",<< pipeline.parameters.skip_steps >>,"
          steps:
            - run:
                name: "🚀 Deploy to Production"
                command: echo "Deploying to production"

      # Run Performance Tests
      - log_step_check:
          step_name: "Run Performance Tests"
      - when:
          condition:
            not:
              matches:
                pattern: ".*Run Performance Tests.*"
                value: ",<< pipeline.parameters.skip_steps >>,"
          steps:
            - run:
                name: "🔍 Run Performance Tests"
                command: echo "Running performance tests"
                no_output_timeout: 60m

      # Update Customer Environments
      - log_step_check:
          step_name: "Update Customer Environments"
      - when:
          condition:
            not:
              matches:
                pattern: ".*Update Customer Environments.*"
                value: ",<< pipeline.parameters.skip_steps >>,"
          steps:
            - run:
                name: "🚀 Update Customer Environments"
                command: |
                  echo "Updating customer environments"
                  echo "Adding verification steps"

      # Prepare On-Prem Artifacts
      - log_step_check:
          step_name: "Prepare On-Prem Artifacts"
      - when:
          condition:
            not:
              matches:
                pattern: ".*Prepare On-Prem Artifacts.*"
                value: ",<< pipeline.parameters.skip_steps >>,"
          steps:
            - run:
                name: "📦 Prepare On-Prem Artifacts"
                command: |
                  echo "Building artifacts"
                  echo "Running verification"
                  echo "Uploading to artifact storage"

      # Notify Slack
      - notify_slack

workflows:
  version: 2
  deploy_pipeline:
    jobs:
      - deploy_pipeline:
          name: deploy_pipeline
          filters:
            branches:
              only:
                - main
