version: 2.1

parameters:
  skip_steps:
    type: string
    default: ""

jobs:
  test:
    parameters:
      skip_steps:
        type: string
        default: ""
    docker:
      - image: cimg/python:3.9
    steps:
      - run:
          name: Show skip_steps
          command: echo "Skip step param is << parameters.skip_steps >>"

workflows:
  version: 2
  test_flow:
    jobs:
      - test:
          skip_steps: << pipeline.parameters.skip_steps >>
