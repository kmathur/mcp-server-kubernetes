version: 2.1

parameters:
  skip_steps:
    type: string
    default: ""
    description: "Comma-separated list of step names to skip (e.g., 'run_tests,deploy_prod')"

commands:
  notify_slack:
    description: "Notify Slack about deployment status"
    steps:
      - run:
          name: Send Slack Notification
          command: |
            echo "Implement Slack notification"

  should_skip_step:
    description: "Check if a step should be skipped"
    parameters:
      step_name:
        type: string
    steps:
      - run:
          name: Check if step << parameters.step_name >> should be skipped
          command: |
            if [[ "<< pipeline.parameters.skip_steps >>" == *"<< parameters.step_name >>"* ]]; then
              echo "Skipping step << parameters.step_name >>"
              circleci-agent step halt
            fi

jobs:
  deploy_pipeline:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout

      - should_skip_step:
          step_name: "deploy_to_edge_env"
      - run:
          name: "🔧 Deploy to Edge Environment"
          command: echo "Pretend we're setting up the environment"

      - should_skip_step:
          step_name: "run_smoke_tests"
      - run:
          name: "🧪 Run Smoke Tests"
          command: echo "Pretend we're running smoke tests"
          no_output_timeout: 30m

      - should_skip_step:
          step_name: "cleanup_test_env"
      - run:
          name: "🧪 Cleanup Test Environment"
          command: echo "Pretend we're cleaning up the environment"

      - should_skip_step:
          step_name: "run_python_tests"
      - run:
          name: "🧪 Run Python Unit Tests"
          command: echo "Running Python tests"
          no_output_timeout: 30m

      - should_skip_step:
          step_name: "run_playwright_tests"
      - run:
          name: "🧪 Run Playwright Tests"
          command: echo "Running Playwright tests"
          no_output_timeout: 30m

      - should_skip_step:
          step_name: "validate_edge_upgrade"
      - run:
          name: "✅ Validate Edge Upgrade Requirements"
          command: echo "Checking prerequisites for edge deployment"

      - should_skip_step:
          step_name: "deploy_to_edge"
      - run:
          name: "🚀 Deploy to Edge"
          command: echo "Deploying to edge"

      - should_skip_step:
          step_name: "deploy_to_prod"
      - run:
          name: "🚀 Deploy to Production"
          command: echo "Deploying to production"

      - should_skip_step:
          step_name: "run_perf_tests"
      - run:
          name: "🔍 Run Performance Tests"
          command: echo "Running performance tests"
          no_output_timeout: 60m

      - should_skip_step:
          step_name: "update_customer_envs"
      - run:
          name: "🚀 Update Customer Environments"
          command: |
            echo "Updating customer environments"
            echo "Adding verification steps"

      - should_skip_step:
          step_name: "prepare_onprem_artifacts"
      - run:
          name: "📦 Prepare On-Prem Artifacts"
          command: |
            echo "Building artifacts"
            echo "Running verification"
            echo "Uploading to artifact storage"

      - notify_slack

workflows:
  version: 2
  deploy_pipeline:
    jobs:
      - deploy_pipeline
