version: 2.1

parameters:
  skip_steps_by_name:
    type: string
    default: ""
    description: "Comma-separated list of step names to skip (e.g., 'Run smoke tests,Run Playwright Tests')"

commands:
  run_step_with_skip_check:
    description: "Run a step with optional skipping based on step name"
    parameters:
      step_name:
        type: string
      command:
        type: string
    steps:
      - run:
          name: "<< parameters.step_name >>"
          command: |
            if [[ ",<< pipeline.parameters.skip_steps_by_name >>," == *",<< parameters.step_name >>,"* ]]; then
              echo "[Skipped] << parameters.step_name >>"
              exit 0
            fi
            echo "[Running] << parameters.step_name >>"
            << parameters.command >>

jobs:
  deploy_pipeline:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout

      - run_step_with_skip_check:
          step_name: "🔧 Step 1 - Deploy to Edge Environment"
          command: echo "Deploying to edge environment"

      - run_step_with_skip_check:
          step_name: "🧪 Step 2 - Run smoke tests"
          command: echo "Running smoke tests..."

      - run_step_with_skip_check:
          step_name: "🧪 Step 3 - Cleanup Test Environment"
          command: echo "Cleaning up test environment..."

      - run_step_with_skip_check:
          step_name: "🧪 Step 4 - Run Python Unit Tests"
          command: echo "Running Python unit tests..."

      - run_step_with_skip_check:
          step_name: "🧪 Step 5 - Run Playwright Tests"
          command: echo "Running Playwright tests..."

      - run_step_with_skip_check:
          step_name: "✅ Step 6 - Validate Edge Upgrade Requirements"
          command: echo "Validating edge upgrade requirements..."

      - run_step_with_skip_check:
          step_name: "🚀 Step 7 - Deploy to Edge"
          command: echo "Deploying to edge..."

      - run_step_with_skip_check:
          step_name: "🚀 Step 8 - Deploy to Production"
          command: echo "Deploying to production..."

      - run_step_with_skip_check:
          step_name: "🔍 Step 9 - Run Performance Tests"
          command: echo "Running performance tests..."

      - run_step_with_skip_check:
          step_name: "🚀 Step 10 - Update Customer Environments"
          command: echo "Updating customer environments..."

      - run_step_with_skip_check:
          step_name: "📦 Step 11 - Prepare On-Prem Artifacts"
          command: echo "Preparing on-prem artifacts..."

workflows:
  version: 2
  deploy_pipeline:
    jobs:
      - deploy_pipeline
