version: 2.1

parameters:
  skip_steps:
    type: string
    default: ""
    description: "Comma-separated list of step names to skip"

jobs:
  deploy_pipeline:
    docker:
      - image: cimg/python:3.9
    steps:
      - checkout

      # Debug step to show skip list
      - run:
          name: "Show Skip List"
          command: |
            echo "Skip list: '<< pipeline.parameters.skip_steps >>'"

      # Use individual steps without complex logic
      - unless:
          condition:
            or:
              - equal:
                  [
                    "Deploy to Edge Environment",
                    << pipeline.parameters.skip_steps >>,
                  ]
              - matches:
                  pattern: "Deploy to Edge Environment,"
                  value: << pipeline.parameters.skip_steps >>
              - matches:
                  pattern: ",Deploy to Edge Environment"
                  value: << pipeline.parameters.skip_steps >>
              - matches:
                  pattern: ",Deploy to Edge Environment,"
                  value: << pipeline.parameters.skip_steps >>
          steps:
            - run:
                name: "🔧 Deploy to Edge Environment"
                command: echo "Pretend we're setting up the environment"

      - unless:
          condition:
            or:
              - equal:
                  ["Run Playwright Tests", << pipeline.parameters.skip_steps >>]
              - matches:
                  pattern: "Run Playwright Tests,"
                  value: << pipeline.parameters.skip_steps >>
              - matches:
                  pattern: ",Run Playwright Tests"
                  value: << pipeline.parameters.skip_steps >>
              - matches:
                  pattern: ",Run Playwright Tests,"
                  value: << pipeline.parameters.skip_steps >>
          steps:
            - run:
                name: "🧪 Run Playwright Tests"
                command: echo "Pretend we're running Playwright tests"

      # This step always runs to verify we can proceed after Playwright
      - run:
          name: "Checkpoint After Playwright"
          command: echo "This should always run"

      - unless:
          condition:
            or:
              - equal: ["Deploy to Edge", << pipeline.parameters.skip_steps >>]
              - matches:
                  pattern: "Deploy to Edge,"
                  value: << pipeline.parameters.skip_steps >>
              - matches:
                  pattern: ",Deploy to Edge"
                  value: << pipeline.parameters.skip_steps >>
              - matches:
                  pattern: ",Deploy to Edge,"
                  value: << pipeline.parameters.skip_steps >>
          steps:
            - run:
                name: "🚀 Deploy to Edge"
                command: echo "Deploying to edge"

workflows:
  version: 2
  deploy_pipeline:
    jobs:
      - deploy_pipeline
