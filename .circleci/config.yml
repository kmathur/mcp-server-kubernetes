version: 2.1

parameters:
  skip_steps_by_name:
    type: string
    default: ""
    description: "Comma-separated list of keywords to fuzzy match for skipped step names"

commands:
  notify_slack:
    description: "Notify Slack about deployment status"
    steps:
      - run:
          name: Send Slack Notification
          command: echo "Slack notification logic here"

  should_skip_step_by_name:
    description: "Skip step based on fuzzy match with step name"
    parameters:
      step_name:
        type: string
    steps:
      - run:
          name: Check if step << parameters.step_name >> should be skipped
          command: |
            SKIP_STEPS=$(echo "<< pipeline.parameters.skip_steps_by_name >>" | tr '[:upper:]' '[:lower:]')
            STEP_NAME=$(echo "<< parameters.step_name >>" | tr '[:upper:]' '[:lower:]')

            if echo "$SKIP_STEPS" | grep -q "$STEP_NAME"; then
              echo "[Skipped] << parameters.step_name >>"
              circleci-agent step halt
            fi

jobs:
  deploy_pipeline:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout

      # Setup and validation
      - should_skip_step_by_name:
          step_name: "Step 1 - Deploy to Edge Environment"
      - run:
          name: "🔧 Step 1 - Deploy to Edge Environment"
          command: echo "Setting up environment"

      - should_skip_step_by_name:
          step_name: "Step 2 - Run smoke tests"
      - run:
          name: "🧪 Step 2 - Run smoke tests"
          command: echo "Running smoke tests"
          no_output_timeout: 30m

      - should_skip_step_by_name:
          step_name: "Step 3 - Cleanup Test Environment"
      - run:
          name: "🧪 Step 3 - Cleanup Test Environment"
          command: echo "Cleaning up environment"

      - should_skip_step_by_name:
          step_name: "Step 4 - Run Python Unit Tests"
      - run:
          name: "🧪 Step 4 - Run Python Unit Tests"
          command: echo "Running Python unit tests"
          no_output_timeout: 30m

      - should_skip_step_by_name:
          step_name: "Step 5 - Run Playwright Tests"
      - run:
          name: "🧪 Step 5 - Run Playwright Tests"
          command: echo "Running Playwright tests"
          no_output_timeout: 30m

      - should_skip_step_by_name:
          step_name: "Step 6 - Validate Edge Upgrade Requirements"
      - run:
          name: "✅ Step 6 - Validate Edge Upgrade Requirements"
          command: echo "Checking prerequisites"

      - should_skip_step_by_name:
          step_name: "Step 7 - Deploy to Edge"
      - run:
          name: "🚀 Step 7 - Deploy to Edge"
          command: echo "Deploying to edge"

      - should_skip_step_by_name:
          step_name: "Step 8 - Deploy to Production"
      - run:
          name: "🚀 Step 8 - Deploy to Production"
          command: echo "Deploying to production"

      - should_skip_step_by_name:
          step_name: "Step 9 - Run Performance Tests"
      - run:
          name: "🔍 Step 9 - Run Performance Tests"
          command: echo "Running performance tests"
          no_output_timeout: 60m

      - should_skip_step_by_name:
          step_name: "Step 10 - Update Customer Environments"
      - run:
          name: "🚀 Step 10 - Update Customer Environments"
          command: echo "Updating customer environments"

      - should_skip_step_by_name:
          step_name: "Step 11 - Prepare On-Prem Artifacts"
      - run:
          name: "📦 Step 11 - Prepare On-Prem Artifacts"
          command: echo "Building and uploading artifacts"

      - notify_slack

workflows:
  version: 2
  deploy_pipeline:
    jobs:
      - deploy_pipeline:
