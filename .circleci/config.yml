version: 2.1

parameters:
  skip_steps:
    type: string
    default: ""

jobs:
  test:
    docker:
      - image: cimg/python:3.9
    steps:
      - run: echo "Skip step param is << pipeline.parameters.skip_steps >>"

workflows:
  version: 2
  test_flow:
    jobs:
      - test:
          skip_steps: << pipeline.parameters.skip_steps >>
